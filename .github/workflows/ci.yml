name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # ワークスペースは Node 22 以上を前提（Nuxt 4 のビルドが要求）するため .nvmrc に固定する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run lint:root
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:root
      - run: bun run build
      - run: bun run validate:requirements

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ワークスペースは Node 22 以上を前提（Nuxt 4 のビルドが要求）するため .nvmrc に固定する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # 2 回続けて適用し、マイグレーションが冪等であることを検証する
      - run: bun run db:migrate:local
      - run: bun run db:migrate:local
